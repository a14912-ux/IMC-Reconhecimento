<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AI Body Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>AI Body Scanner</h1>

    <div class="camera-box">
        <video id="video" autoplay></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="buttons">
        <button id="startCamera">Abrir Câmara</button>
        <button id="takePhoto">Tirar Foto</button>
    </div>

    <div id="result" class="result">
        Resultado vai aparecer aqui
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
